<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gentle Eats</title>
<style>
  :root { color-scheme: light dark; --ink:#1a1a1a; --soft:#5c5c5c; --bg:#faf9f6; --line:#e6e3dc; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f2f0ec; --soft:#a8a39a; --bg:#151513; --line:#33322e; }
  }
  body { margin:0; background:var(--bg); color:var(--ink); display:grid; place-items:center;
         min-height:100vh; font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width:32rem; padding:2rem 1.25rem; }
  h1 { font-size:2.5rem; letter-spacing:-.03em; margin:0 0 .25rem; }
  p { color:var(--soft); margin:.25rem 0 2rem; }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:.85rem 0; border-top:1px solid var(--line); }
  a { color:inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Gentle Eats</h1>
  <p>Track what your body already knows.</p>
  <ul>
    <li><a href="privacy.html">Privacy Policy</a></li>
    <li><a href="support.html">Support</a></li>
  </ul>
</div>
</body>
</html>
